{% extends 'base.html' %}

{% block title %}Admin Portal Login - CareerMatch AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="cm-card p-4 shadow-md border-danger-subtle">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-2 bg-dark" style="width:48px; height:48px; font-size:1.4rem;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Admin Portal</h3>
                    <p class="text-muted small">Log in with system administrator credentials</p>
                </div>

                <form method="POST" action="{{ url_for('admin.admin_login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Admin Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control" id="email" name="email" value="admin@careermatch.ai" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 justify-content-center">
                        <i class="bi bi-shield-check me-1"></i> Admin Login
                    </button>
                </form>

                <div class="mt-4 p-3 bg-light rounded border text-center small">
                    <strong class="d-block text-dark mb-1"><i class="bi bi-info-circle me-1"></i> Default Admin Credentials:</strong>
                    <code>admin@careermatch.ai</code> / <code>Admin@123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
