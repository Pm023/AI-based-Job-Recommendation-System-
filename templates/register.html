{% extends 'base.html' %}

{% block title %}Register Student Account - CareerMatch AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="cm-card p-4 shadow-md">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-2" style="width:48px; height:48px; font-size:1.4rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Student Account</h3>
                    <p class="text-muted small">Build your profile and discover explainable job matches</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold small">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Bhavik Patel" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold small">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-cm w-100 py-2 justify-content-center">
                        <i class="bi bi-person-check-fill"></i> Register & Setup Profile
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center small text-muted">
                    Already registered? <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary">Log In Here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
